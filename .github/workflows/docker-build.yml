# ==========================================
# 多架构 Docker 镜像构建与推送
# ==========================================
# 触发方式:
#   1. 推送 tag 以 v 开头（如 v0.0.1, v0.0.2）
#   2. 手动触发: GitHub 仓库 → Actions → 选择此 workflow → Run workflow
#
# 前置条件（在 GitHub 仓库 Settings → Secrets and variables → Actions 中设置）:
#   DOCKER_USERNAME - Docker Hub 用户名
#   DOCKER_PASSWORD - Docker Hub 密码或 Access Token
# ==========================================

name: Build and Push Multi-Arch Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（如 0.0.1，留空自动从 git tag 获取）'
        required: false
        default: ''
      base_registry:
        description: '基础镜像 registry（国内用户: docker.m.daocloud.io）'
        required: false
        default: ''

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # 镜像标签逻辑: 手动触发时用输入的 tag，否则用 git tag 名（去掉 v 前缀）
  IMAGE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref_name, 'v') && github.ref_name) || '' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 如果 IMAGE_TAG 为空，报错提示
    # 如果 DOCKER_USERNAME 或 DOCKER_PASSWORD 未设置，报错提示
    steps:
      - name: 检查参数
        run: |
          if [ -z "${{ env.IMAGE_TAG }}" ]; then
            echo "❌ 未指定镜像标签"
            echo "   推送 tag 触发: 推送 v0.0.1 格式的 tag"
            echo "   手动触发: 在 Run workflow 的 tag 输入框中填写标签"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ 未配置 Docker Hub 密钥"
            echo "   请在 Settings → Secrets and variables → Actions 中设置:"
            echo "     DOCKER_USERNAME - Docker Hub 用户名"
            echo "     DOCKER_PASSWORD - Docker Hub 密码或 Access Token"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（用于跨平台构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送后端镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/udpxy-scanner-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/udpxy-scanner-backend:latest
          build-args: |
            BASE_REGISTRY=${{ github.event.inputs.base_registry || 'docker.io' }}
            REGISTRY_MIRROR=

      - name: 构建并推送前端镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/udpxy-scanner-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/udpxy-scanner-frontend:latest
          build-args: |
            BASE_REGISTRY=${{ github.event.inputs.base_registry || 'docker.io' }}