name: GitHub Scanner

on:
  # 1. 每小时执行一次
  # schedule:
  #   - cron: '18 * * * *'

  # 2. 允许手动触发
  workflow_dispatch:

jobs:
  run_scanner:
    runs-on: ubuntu-latest
    environment: "env"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp

      - name: Ensure data directory exists
        run: mkdir -p .github/data

      - name: Run GitHub Scanner
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          PREFETCH_QUERIES: '["/udp/ extension:m3u", "/rtp/ extension:m3u", "/udp/ extension:txt", "/rtp/ extension:txt", "filename:result.txt path:output/ipv4"]'
          OUTPUT_FILE: .github/data/github.txt
        run: |
          python .github/scripts/github.py

      - name: Commit and push results
        env:
          OUTPUT_FILE: .github/data/github.txt
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add "$OUTPUT_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update github results [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
