name: Quake Scanner

on:
  # 1. 每 3 天执行一次
  schedule:
    - cron: '0 0 */3 * *'

  # 2. 允许手动触发
  workflow_dispatch:

jobs:
  run_scanner:
    runs-on: ubuntu-latest
    environment: "env"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp

      - name: Prepare data directory
        run: mkdir -p .github/data

      - name: Run Quake Scanner
        env:
          QUAKE_API_KEY: ${{ secrets.QUAKE_API_KEY }}
          OUTPUT_FILE: .github/data/quake.txt
        run: |
          python .github/scripts/quake.py

      - name: Commit and push results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          if [ -f "$OUTPUT_FILE" ]; then
            git add "$OUTPUT_FILE"
            if ! git diff --cached --quiet; then
              git commit -m "chore(data): update quake results [skip ci]"
              git push
            else
              echo "No changes to commit"
            fi
          else
            echo "Output file not found, skipping commit"
          fi
