name: 360 Quake Push Task

on:
  # 1. 由订阅调度器每 3 天触发一次（月均 ~10 次，匹配免费额度）
  repository_dispatch:
    types: [trigger_quake]

  # 2. 保留手动触发，方便调试
  workflow_dispatch:

jobs:
  run_scanner:
    runs-on: ubuntu-latest
    environment: "env"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp

      - name: Run Quake Scanner
        env:
          QUAKE_API_KEY: ${{ secrets.QUAKE_API_KEY }}
          PUSH_CALLBACK_URL: ${{ secrets.PUSH_CALLBACK_URL }}
          PUSH_API_KEY: ${{ secrets.PUSH_API_KEY }}
        run: |
          python .github/scripts/quake.py