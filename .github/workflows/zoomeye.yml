name: ZoomEye Scanner

on:
  # 1. 每小时执行一次
  schedule:
    - cron: '0 * * * *'

  # 2. 允许手动触发
  workflow_dispatch:

jobs:
  run_scanner:
    runs-on: ubuntu-latest
    environment: "env"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install playwright aiohttp
          playwright install chromium

      - name: Run ZoomEye Scanner
        env:
          OUTPUT_FILE: .github/data/zoomeye.txt
        run: |
          python .github/scripts/zoomeye.py

      - name: Commit and push results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .github/data/zoomeye.txt
          git diff --cached --quiet || git commit -m "chore(data): update zoomeye results [skip ci]"
          git push
