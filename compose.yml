services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: udpxy-scanner-backend
    ports:
      - "7860:7860"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - TZ=${TZ}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: udpxy-scanner-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: udpxy-scanner-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql  # <--- 新增这行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10          # 从 5 次增加到 10 次
      start_period: 30s    # 新增此行：给容器启动和 SQL 导入预留 30 秒宽限期，期间健康检查失败不会直接杀死依赖
    restart: unless-stopped

volumes:
  postgres_data:
