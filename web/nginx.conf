worker_processes 1;
events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;

        # SPA 路由
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API 反向代理到后端服务
        # 用 set + resolver 做延迟解析，避免独立部署时因 "backend" 不可达导致 nginx 无法启动
        # - docker compose 场景：Docker DNS (127.0.0.11) 解析 backend 为后端容器
        # - 独立部署场景：JS 通过 VITE_BACKEND_URL 直连后端，不走此代理，但 nginx 仍能正常启动
        # - 只能用 Docker DNS (127.0.0.11) 解析 backend 服务名，不加外网 DNS 回退
        # - 否则外网 DNS 不认识 backend 会返回 NXDOMAIN → 502
        resolver 127.0.0.11 valid=10s;
        location /api/ {
            set $backend_upstream __VITE_BACKEND_URL__;
            proxy_pass $backend_upstream;
            proxy_next_upstream error timeout http_502;
            proxy_next_upstream_tries 3;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
